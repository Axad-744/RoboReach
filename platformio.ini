; RoboReach PlatformIO Configuration
; ESP32-WROOM-32-compatible generic ESP32 Dev Module with Arduino-ESP32 core 3.x

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Leave ports unset for auto-detection. If needed, set them per computer:
; upload_port = COM14
; monitor_port = COM14

; Build properties
build_flags = 
    ; Enable C++ exceptions if needed
    ; -DARDUINO_ARCH_ESP32

; Library dependencies
lib_deps = 
    madhephaestus/ESP32Servo
    ; RoboLink library - installed via Arduino Library Manager

; Debugging options
debug_tool = cmsis-dap

; Upload options
upload_speed = 921600
